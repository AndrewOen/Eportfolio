<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #f3efe6; letter-spacing: 4px; text-anchor: middle; }
      .label { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #f5f0e6; font-size: 19px; text-anchor: middle; letter-spacing: 0.5px; }
      .desc { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #cdc7b8; font-size: 17px; text-anchor: middle; }
      .grid-line { stroke: rgba(255, 255, 255, 0.18); stroke-width: 1.2; }
      .center-circle { fill: none; stroke: rgba(255, 255, 255, 0.22); stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#2c3026" />

  <!-- Layout Architectural Framing Grid Lines -->
  <rect x="64" y="36" width="832" height="468" fill="none" class="grid-line" />
  <line x1="64" y1="90" x2="896" y2="90" class="grid-line" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="64" y1="450" x2="896" y2="450" class="grid-line" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="160" y1="36" x2="160" y2="504" class="grid-line" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="800" y1="36" x2="800" y2="504" class="grid-line" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Centered Subtle Circle Geometry -->
  <circle cx="480" cy="270" r="215" class="center-circle" />

  <!-- Presentation Title -->
  <text x="480" y="210" class="title" font-size="46">LAW2 ENDCAP</text>
  <text x="480" y="268" class="title" font-size="46">REDESIGNS</text>

  <!-- Presenter 1: Andrew -->
  <text x="480" y="325" class="label">Andrew:</text>
  <text x="480" y="352" class="desc">Up Down &amp; Up Down Drop</text>

  <!-- Presenter 2: Lucas -->
  <text x="480" y="398" class="label">Lucas:</text>
  <text x="480" y="425" class="desc">Surf Pend &amp; Surf Pend Drop</text>
</svg>
