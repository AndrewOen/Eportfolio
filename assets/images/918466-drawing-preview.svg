<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fdfefe; }
      .border { stroke: #1e293b; stroke-width: 2; fill: none; }
      .cad-line { stroke: #0f172a; stroke-width: 1.5; fill: none; }
      .center-line { stroke: #0284c7; stroke-width: 0.8; stroke-dasharray: 8 4 2 4; fill: none; }
      .dim-line { stroke: #64748b; stroke-width: 0.75; fill: none; }
      .dim-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
      .tb-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .tb-meta { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #334155; }
    </style>
  </defs>

  <rect width="800" height="500" class="bg" />
  <rect x="20" y="20" width="760" height="460" class="border" />

  <!-- Front View Projection -->
  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="140" height="280" rx="4" class="cad-line" stroke-width="2" />
    <!-- Inner mechanical stop contour -->
    <path d="M 20,40 L 120,40 L 120,80 Q 90,110 120,140 L 120,180 Q 90,210 120,240 L 20,240 Q 50,210 20,180 L 20,140 Q 50,110 20,80 Z" class="cad-line" fill="#f1f5f9" />
    <!-- 6 Mounting Holes -->
    <circle cx="35" cy="55" r="7" class="cad-line" fill="#e2e8f0" />
    <circle cx="105" cy="55" r="7" class="cad-line" fill="#e2e8f0" />
    <circle cx="35" cy="140" r="7" class="cad-line" fill="#e2e8f0" />
    <circle cx="105" cy="140" r="7" class="cad-line" fill="#e2e8f0" />
    <circle cx="35" cy="225" r="7" class="cad-line" fill="#e2e8f0" />
    <circle cx="105" cy="225" r="7" class="cad-line" fill="#e2e8f0" />
    <!-- Centerline -->
    <line x1="70" y1="-15" x2="70" y2="295" class="center-line" />
    <!-- Dimensions -->
    <line x1="-15" y1="0" x2="-15" y2="280" class="dim-line" />
    <text x="-25" y="145" class="dim-text" transform="rotate(-90, -25, 145)">4.171</text>
    <line x1="0" y1="295" x2="140" y2="295" class="dim-line" />
    <text x="70" y="310" class="dim-text">2.031</text>
  </g>

  <!-- Side View / Section A-A -->
  <g transform="translate(290, 70)">
    <rect x="0" y="0" width="35" height="280" class="cad-line" fill="#f8fafc" />
    <!-- Raised stop 0.050" -->
    <rect x="0" y="30" width="12" height="220" class="cad-line" fill="#e2e8f0" />
    <text x="18" y="305" class="dim-text">SECTION A-A</text>
    <text x="18" y="320" class="dim-text">SCALE 1/1</text>
  </g>

  <!-- Isometric View Preview -->
  <g transform="translate(420, 75)">
    <path d="M 50,20 L 150,0 L 170,180 L 70,200 Z" class="cad-line" fill="#f8fafc" />
    <path d="M 50,20 L 70,200 L 40,200 L 20,20 Z" class="cad-line" fill="#e2e8f0" />
    <ellipse cx="110" cy="95" rx="35" ry="55" class="cad-line" stroke-dasharray="2 2" />
    <text x="100" y="225" class="dim-text">ISO VIEW (CAD MODEL)</text>
  </g>

  <!-- ASME Title Block -->
  <g transform="translate(430, 360)">
    <rect x="0" y="0" width="350" height="120" class="border" fill="#ffffff" />
    <line x1="0" y1="35" x2="350" y2="35" class="border" />
    <line x1="0" y1="70" x2="350" y2="70" class="border" />
    <line x1="230" y1="35" x2="230" y2="120" class="border" />
    
    <text x="12" y="24" class="tb-title" font-size="13">END CAP UP DWN v2 FLAT BACK</text>
    <text x="12" y="52" class="tb-meta">PART NO: 918466</text>
    <text x="12" y="65" class="tb-meta">MATERIAL: A383 / ADC12 DIE-CAST</text>
    <text x="12" y="88" class="tb-meta">BY: ANDREW OEN</text>
    <text x="12" y="102" class="tb-meta">LSI INDUSTRIES INC. | ASME Y14.5-2009</text>
    
    <text x="242" y="55" class="tb-meta" font-weight="700">DATE: 6/8/2026</text>
    <text x="242" y="85" class="tb-meta">SCALE: 1/1</text>
    <text x="242" y="105" class="tb-meta">SHEET 1 OF 3</text>
  </g>
</svg>
